name: platform

services:
  health:
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    volumes:
      - "./health:/www:ro"
    restart: unless-stopped
    mem_limit: 16m
    ports:
      - "${HEALTH_BIND_IP:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ml
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d ml"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler:
    build:
      context: ..
      dockerfile: infra/jobs/Dockerfile
    command: ["supercronic", "/app/infra/cron/crontab"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql+psycopg://ingestor:${POSTGRES_INGESTOR_PASSWORD:?POSTGRES_INGESTOR_PASSWORD is required}@postgres:5432/ml
    depends_on:
      postgres:
        condition: service_healthy

  jobs:
    build:
      context: ..
      dockerfile: infra/jobs/Dockerfile
    profiles: ["jobs"]
    restart: "no"
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql+psycopg://ingestor:${POSTGRES_INGESTOR_PASSWORD:?POSTGRES_INGESTOR_PASSWORD is required}@postgres:5432/ml
      DATABASE_URL_ADMIN: postgresql+psycopg://${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}:${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}@postgres:5432/ml
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: {}
