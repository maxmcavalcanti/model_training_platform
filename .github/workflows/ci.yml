name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Ephemeral CI database, not a secret
      DATABASE_URL_TEST: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ml_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so pin the exact release
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL_ADMIN: postgresql+psycopg://postgres:postgres@localhost:5432/ml_ci
      - run: uv run pytest
      - run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example config -q
      - run: shellcheck infra/scripts/*.sh

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f infra/docker-compose.yml --env-file infra/.env.example
    steps:
      - uses: actions/checkout@v7
      - run: $COMPOSE up -d --wait postgres
      - name: Check every host rule uses scram-sha-256
        run: |
          count="$($COMPOSE exec -T postgres psql -U platform_admin -d ml -tAc "select count(*) from pg_hba_file_rules where type like 'host%' and auth_method <> 'scram-sha-256'")"
          echo "non-scram host rules: $count"
          test "$count" = 0
      - name: Check Postgres is not published on 0.0.0.0
        run: $COMPOSE ps --format '{{.Ports}}' postgres | grep -v '0\.0\.0\.0'
      - run: $COMPOSE build jobs
      - run: $COMPOSE run --rm jobs
      - name: Check the jobs image runs as a non-root user
        run: test "$($COMPOSE run --rm -T jobs whoami)" = app
      - run: $COMPOSE run --rm jobs alembic upgrade head
      - name: Check migrations reached head
        run: $COMPOSE run --rm -T jobs alembic current | grep -F '(head)'
      - run: $COMPOSE build scheduler
      - name: Check the crontab parses
        run: $COMPOSE run --rm -T scheduler supercronic -test /app/infra/cron/crontab
      - name: Check the scheduler runs in America/Sao_Paulo
        run: test "$($COMPOSE run --rm -T scheduler date +%Z)" = "-03"
      - name: Check the scheduler has no admin database URL
        run: |
          if $COMPOSE run --rm -T scheduler printenv DATABASE_URL_ADMIN; then exit 1; fi
      - run: $COMPOSE up -d scheduler
      - name: Check the scheduler stays up
        run: |
          sleep 10
          $COMPOSE ps --status running --services | grep -x scheduler
          $COMPOSE logs scheduler
      - if: always()
        run: $COMPOSE down -v
