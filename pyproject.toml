[project]
name = "platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "flows"]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds Portuguese prose with illustrative code blocks, not code to format
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: needs Postgres, see AGENTS.md, Commands"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
]
