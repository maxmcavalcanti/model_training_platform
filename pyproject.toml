[project]
name = "platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pandera>=0.35.0",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.1.8",
    "tzdata>=2026.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "flows"]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds Portuguese prose with illustrative code blocks, not code to format
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: needs Postgres, see AGENTS.md, Commands"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
]
