[project]
name = "platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "holidays>=0.108",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pandera>=0.35.0",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "sqlalchemy>=2.1.8",
    "tzdata>=2026.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "flows"]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds Portuguese prose with illustrative code blocks, not code to format
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest relies on bare assert; SQL in tests is built from test constants, never external input
"tests/**" = ["S101", "S608"]
# runs ruff through subprocess with a fixed argv
"tests/test_lint_config.py" = ["S603"]
# git is looked up on PATH on purpose so the test runs on any developer machine and on CI;
# "0.0.0.0" literals are inputs the compose checkers must reject, not binds
"tests/infra/test_compose.py" = ["S607", "S104"]
# applied migration; role names come from the ROLES constant, and rewriting an applied
# migration is riskier than the finding
"migrations/versions/0002_roles.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: needs Postgres, see AGENTS.md, Commands"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
    "zizmor>=1.32.0",
]
